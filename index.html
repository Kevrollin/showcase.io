<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="%BRAND_THEME_COLOR%" />
    <title>%BRAND_NAME% — %BRAND_PROMISE%</title>
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- %SUPABASE_PRECONNECT% -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:title" content="%BRAND_NAME% — %BRAND_PROMISE%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Shown until the app's JavaScript renders (slow networks). */
      html, body { margin: 0; background: #faf8f4; }
      .boot { min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
      .boot span { width: 28px; height: 28px; border-radius: 8px; background: #1b2741; animation: boot 1.2s ease-in-out infinite; }
      @keyframes boot { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .boot span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true"><span></span></div></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px; text-align: center">
        %BRAND_NAME% needs JavaScript to run. Please enable it in your browser settings.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

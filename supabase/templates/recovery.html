<!-- Supabase Auth → Email Templates → "Reset password". Handled by /auth/confirm. -->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #172033;">
  <h1 style="font-size: 22px; margin: 0 0 12px;">Reset your password</h1>
  <p style="font-size: 15px; line-height: 1.6; color: #5b6375; margin: 0 0 24px;">
    We received a request to reset the password for your Showcase account. This link works once and expires soon.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
       style="display: inline-block; background: #1b2741; color: #ffffff; text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 10px;">
      Choose a new password
    </a>
  </p>
  <p style="font-size: 13px; line-height: 1.6; color: #868c99; margin: 0;">
    If you didn't ask for this, you can ignore this email — your password won't change.
  </p>
</div>
